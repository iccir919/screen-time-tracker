<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Time: Today</title>
<!-- The page's typeface. Without internet it falls back to the system font. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<!-- The Today and Trends pages share dashboard.js; data-page says which this is -->
<body data-page="today">
<main class="page">
  <header class="topbar">
    <div class="brand-nav">
      <div class="brand">Screen Time</div>
      <nav class="tabs" aria-label="Pages">
        <a href="/" aria-current="page">Today</a>
        <a href="/trends">Trends</a>
        <a href="/apps">Apps</a>
        <a href="/organize">Organize</a>
      </nav>
    </div>
    <div class="refresh">
      <span class="refresh-note" id="refresh-note" aria-live="polite"></span>
      <button class="button" id="refresh" title="Save new Screen Time data now (the same as npm run archive)">Refresh</button>
    </div>
  </header>
  <p class="notice error" id="refresh-error" hidden></p>

  <div id="content">
    <div class="range-bar">
      <div class="day-nav">
        <button class="round-button" id="prev" aria-label="Day before">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h1 class="day-label" id="range-label"></h1>
        <button class="round-button" id="next" aria-label="Day after">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="range-switches">
        <div class="seg" id="device-filter" role="group" aria-label="Devices"></div>
      </div>
    </div>

    <!-- shown while something is highlighted: it labels every number below -->
    <div class="focus-bar" id="focus-bar" hidden></div>
    <div class="period-cards" id="period-cards"></div>

    <!-- the day's charts on the left; Used today on the right is the color key
         and the controls: clicking an app or category highlights it -->
    <div class="side-layout">
      <div class="side-main">
        <section class="card">
          <div class="card-head">
            <h2 id="timeline-title">Through the day</h2>
            <span class="hint" id="timeline-hint"></span>
          </div>
          <div id="timeline"></div>
        </section>

        <section class="card" id="run-card">
          <div class="card-head">
            <h2 id="run-title">So far today</h2>
            <span class="hint" id="run-hint"></span>
          </div>
          <div id="run"></div>
        </section>

        <section class="card bars-card">
          <div class="card-head">
            <h2 id="bars-title">Last 8 days</h2>
            <span class="hint" id="bars-hint"></span>
          </div>
          <div id="bars"></div>
        </section>
      </div>

      <aside class="side-panel">
        <section class="card">
          <div class="card-head">
            <h2 id="list-title">Used today</h2>
            <div class="seg small" id="list-switch" role="group" aria-label="Show"></div>
          </div>
          <p class="hint list-when" id="apps-hint"></p>
          <div id="top-apps"></div>
        </section>
      </aside>
    </div>

  </div>
</main>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script type="module" src="dashboard.js"></script>
</body>
</html>
